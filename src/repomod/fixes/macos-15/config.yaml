branch: macos-15-runners
pr_title: "ci: upgrade macos-14 runners to macos-15"
pr_body: |
  ## Summary

  - Upgrade `macos-14` GitHub Actions runners (and `macos-14-large` / `macos-14-xlarge`) to `macos-15` in `.github/`
  - Where a matrix already lists `macos-15`, drop the `macos-14` entry instead of duplicating it

  ## Why

  GitHub is retiring the macOS 14 runner images. Deprecation began July 6, 2026 and the
  images are fully unsupported on **November 2, 2026**, after which jobs using these labels
  are terminated with an error.

  Before that, GitHub runs **brownouts** that deliberately fail `macos-14` jobs, the first
  on **October 5** (14:00-00:00 UTC), with more through October 30. See
  [actions/runner-images#13518](https://github.com/actions/runner-images/issues/13518).

  ## Review notes

  `macos-15` ships different Xcode and simulator versions than `macos-14`. If a job pins an
  Xcode or iOS simulator version, or pinned `macos-14` on purpose to get an older one, check
  that it still works on `macos-15`.

  Generated by `macos-15`.
sparse_paths:
