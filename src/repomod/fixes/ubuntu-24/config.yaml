branch: ubuntu-24-04-runners
pr_title: "ci: upgrade ubuntu 20.04/22.04 runners to 24.04"
pr_body: |
  ## Summary

  - Upgrade `ubuntu-20.04`, `ubuntu-22.04` and `ubuntu-22.04-arm` GitHub Actions runners to `ubuntu-24.04` / `ubuntu-24.04-arm` in `.github/`
  - Where a matrix lists several of these (or already lists `ubuntu-24.04`), collapse to a single entry instead of duplicating it
  - `container:` images and comments are left alone

  ## Why

  GitHub is retiring the Ubuntu 22.04 runner images: deprecation began September 17, 2026
  (expect longer queue times) and they are fully unsupported on **April 17, 2027**, with
  scheduled brownouts that deliberately fail `ubuntu-22.04` jobs in March and April 2027.
  See [actions/runner-images#14254](https://github.com/actions/runner-images/issues/14254).
  `ubuntu-20.04` was already retired in April 2025, so jobs still on it cannot run.

  ## Review notes

  `ubuntu-24.04` ships different system software than 22.04 (glibc 2.39, newer compilers
  and default Python, different packages). Check any job that depends on an older compiler
  or package, an old Python version, or that builds binaries meant to run on older
  distributions: those may need to stay on 22.04 until they are migrated deliberately.
sparse_paths:
  - .github
