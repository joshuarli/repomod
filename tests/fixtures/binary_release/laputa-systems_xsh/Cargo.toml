[package]
name = "xsh"
version = "0.0.1"
edition = "2024"
publish = false
# Keep the integration suites in explicit aggregator targets below; otherwise
# Cargo discovers every tests/*.rs file as a separate test binary.
autotests = false

[workspace]
members = [
    "crates/xsh-applets",
    "crates/xsh-fuzz",
    "crates/xsh-net",
    "crates/xsh-registry",
    "crates/xsh-root",
    "crates/xshi",
    "crates/xsht",
]

[workspace.lints.clippy]
nursery = { level = "allow", priority = -2 }
pedantic = { level = "allow", priority = -2 }
complexity = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -2 }
perf = { level = "deny", priority = -2 }
restriction = { level = "allow", priority = -2 }
suspicious = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = { level = "allow", priority = 0 }
wildcard_imports = { level = "deny", priority = 0 }
disallowed_types = { level = "deny", priority = 1 }
single_call_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
result_large_err = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
type_complexity = { level = "allow", priority = 1 }

[lints.clippy]
nursery = { level = "allow", priority = -2 }
pedantic = { level = "allow", priority = -2 }
complexity = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -2 }
perf = { level = "deny", priority = -2 }
restriction = { level = "allow", priority = -2 }
suspicious = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = { level = "allow", priority = 0 }
wildcard_imports = { level = "deny", priority = 0 }
disallowed_types = { level = "deny", priority = 1 }
single_call_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
result_large_err = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
type_complexity = { level = "allow", priority = 1 }

[lib]
name = "xsh"
path = "src/lib.rs"
doctest = false

[features]
default = ["native-tests", "net", "tools"]
benchmark = []
linux-priv-tests = []
native-tests = ["xsh-registry/native-tests"]
net = [
    "dep:xsh-net",
]
tools = []

[dependencies]
rawzip = "0.5.1"
tar = { version = "0.4.46", default-features = false }
bzip2 = "0.6.1"
blake3 = "1.5.1"
crossbeam-channel = "0.5"
libc = "0.2"
data-encoding = "2"
directories = "6.0.0"
bstr = { version = "1", default-features = false, features = ["std", "unicode"] }
diffy = { version = "0.5.0", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
graviola = "=0.4.1"
ignore = "=0.4.25"
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "encoder", "xz", "optimization"] }
md-5 = "0.11"
memchr = "2"
miniserde = "0.1"
regex-lite = "0.1.9"
rustc-hash = "2.1.3"
rustix = { version = "1.1.4", features = [
    "event", "fs", "linux_5_11", "mount", "net", "param", "pipe", "process", "pty", "stdio",
    "system", "termios", "thread", "time",
] }
sha1 = "0.11"
sha2 = "0.11"
sha3 = { version = "0.12.0", default-features = false, features = ["alloc"] }
shake = "0.1.0"
sm3 = { version = "0.5.0", default-features = false, features = ["alloc"] }
smallvec = "1.15.2"
tempfile = "3"
unicode-width = "=0.2.2"
zstd = { version = "0.13.3", default-features = false }
xsh-net = { path = "crates/xsh-net", optional = true }
xsh-registry = { path = "crates/xsh-registry" }
xsh-root = { path = "crates/xsh-root" }

[dev-dependencies]
async-io = "2"
bytes = "1"
futures-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
laputa-h2-futures-lite = { version = "=0.4.20-beta.0", default-features = false }
laputa-ptytest = "0.1"
http = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
rustls = { version = "0.23.41", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"

[build-dependencies]
xsh-registry = { path = "crates/xsh-registry" }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1.52"
xsh-applets = { path = "crates/xsh-applets" }

[[bin]]
name = "xsh"
path = "src/entrypoints/xsh_main.rs"
test = false

[[bin]]
# The one native helper process the integration tests spawn; each mode is a subcommand.
name = "xsh-test-helper"
path = "tests/helpers/main.rs"
test = false

[[test]]
# The individual files are included as modules by this single test binary.
name = "integration"
path = "tests/integration.rs"

[[test]]
# This source-tree policy has its own process so parallel integration tests cannot affect it.
name = "ambient_fs_policy"
path = "tests/ambient_fs_policy.rs"

[[test]]
# Samples a process-global counter, so it needs its own process.
name = "symbol_plateau"
path = "tests/symbol_plateau.rs"

[[test]]
# Owns exact descriptor and child lifecycles for core applet behavior.
name = "core_compat_boundaries"
path = "tests/core_compat_boundaries.rs"

[[test]]
# Owns PTYs, privileges, shared offsets and exact applet process boundaries.
name = "core_compat_extra"
path = "tests/core_compat_extra.rs"

[[test]]
# Reuses the same source with privileged cases enabled for focused Linux runs.
name = "core_compat_extra_privileged"
path = "tests/core_compat_extra_privileged.rs"
required-features = ["linux-priv-tests"]

[[test]]
name = "linux_priv"
path = "tests/linux_priv.rs"
required-features = ["linux-priv-tests"]

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "thin"
opt-level = 3
# Redundant: DIST_RUSTFLAGS in the Makefile already passes -Cpanic=immediate-abort
# for dist builds. Keeping it here would prevent cargo test --profile dist (the test
# harness needs catch_unwind). The install builds use this profile as well.
# panic = "abort"

[profile.verification]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 64

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
regex-lite = { path = "third_party/regex-lite" }
