[workspace]
resolver = "3"
members = [
    "Modules/_argparse_rs", "Modules/_ast_rs", "Modules/_asyncio_rs", "Modules/_base64", "Modules/_binascii_rs", "Modules/_bisect_rs", "Modules/_bz2_rs", "Modules/_codecs_rs", "Modules/_collections_rs", "Modules/_concurrent_futures_rs", "Modules/_configparser_rs", "Modules/_contextlib_rs",
    "Modules/_csv_rs", "Modules/_dataclasses_rs", "Modules/_datetime_rs", "Modules/_decimal_rs", "Modules/_difflib_rs", "Modules/_elementtree_rs", "Modules/_email_rs", "Modules/_fnmatch_rs", "Modules/_fractions_rs",
    "Modules/_functools_rs", "Modules/_glob_rs", "Modules/_gzip_rs", "Modules/_hashlib_rs", "Modules/_heapq_rs", "Modules/_http_client_rs", "Modules/_hmac_rs", "Modules/_html_parser_rs", "Modules/_importlib_resources_rs", "Modules/_inspect_rs", "Modules/_ipaddress_rs", "Modules/_itertools_rs",
    "Modules/_json_rs", "Modules/_logging_rs", "Modules/_lzma_rs", "Modules/_marshal_rs", "Modules/_metadata_rs", "Modules/_multiprocessing_rs", "Modules/_pathlib_rs", "Modules/_pickle_rs", "Modules/_plistlib_rs", "Modules/_posixpath_rs", "Modules/_random_rs", "Modules/_re_rs",
    "Modules/_shlex_rs", "Modules/_shutil_rs", "Modules/_sqlite3_rs", "Modules/_socket_rs", "Modules/_ssl_rs", "Modules/_statistics_rs", "Modules/_strptime_rs", "Modules/_struct_rs", "Modules/_subprocess_rs", "Modules/_tarfile_rs", "Modules/_tempfile_rs", "Modules/_textwrap_rs", "Modules/_threading_rs",
    "Modules/_tokenize_rs", "Modules/_tomllib_rs", "Modules/_typing_rs",
    "Modules/_unicodedata_rs", "Modules/_urllib_parse_rs", "Modules/_urllib_request_rs", "Modules/_uuid_rs", "Modules/_warnings_rs", "Modules/_zip_rs", "Modules/_zipimport_rs", "Modules/_zlib_rs", "Modules/_zstd_rs",
    "Modules/cpython-build-helper",
    "Modules/cpython-rust-staticlib", "Modules/cpython-sys"
]

[workspace.package]
# Make sure to also update the Rust toolchains in GitHub Actions whenever this version is modified
rust-version = "1.95"

# A `no_std` extension cannot link Rust's unwinding panic runtime; no crate
# here catches a panic (extern "C" entry points abort on unwind already).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
