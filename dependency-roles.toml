[http-client]
ecosystem = "cargo"
preferred = "h12tiny"

[http-client.options]
h12tiny = ["h12tiny", "h12tiny-client-sync"]
hyper = ["hyper", "hyper-util", "hyper-rustls", "smol-hyper"]
reqwest = ["reqwest"]
ureq = ["ureq"]
surf = ["surf"]
isahc = ["isahc"]
attohttpc = ["attohttpc"]
curl = ["curl"]
awc = ["awc"]

[cli-arguments]
ecosystem = "cargo"
preferred = "lexopt"

[cli-arguments.options]
lexopt = ["lexopt"]
clap = ["clap", "clap_complete", "clap_mangen"]
pico-args = ["pico-args"]
argh = ["argh"]
bpaf = ["bpaf"]

[benchmark]
ecosystem = "cargo"
preferred = "rustybench"

[benchmark.options]
rustybench = ["rustybench"]
criterion = ["criterion", "criterion-cycles-per-byte"]
divan = ["divan"]

[async-runtime]
ecosystem = "cargo"
preferred = "smol"

[async-runtime.options]
tokio = ["tokio", "tokio-util"]
smol = ["smol", "futures-lite", "async-io", "async-executor"]
async-std = ["async-std"]

[serialization]
ecosystem = "cargo"
preferred = "deser"

[serialization.options]
deser = ["deser", "deser-json", "deser-toml", "deser-yaml", "deser-value"]
serde = ["serde", "serde_json", "serde_derive", "serde_core", "serde-saphyr", "serde-pickle"]
miniserde = ["miniserde"]
nanoserde = ["nanoserde"]

[regex]
ecosystem = "cargo"
preferred = "regex-lite"

[regex.options]
regex = ["regex", "regex-automata", "regex-syntax"]
regex-lite = ["regex-lite"]
regex-bites = ["regex-bites"]
fancy-regex = ["fancy-regex"]

[logging]
ecosystem = "cargo"
preferred = "log"

[logging.options]
log = ["log", "env_logger"]
tracing = ["tracing", "tracing-subscriber", "tracing-tree"]

[datetime]
ecosystem = "cargo"
preferred = "jiff"

[datetime.options]
