[http]
ecosystem = "cargo"
preferred = "h12tiny"

[http.options]
h12tiny = [
  "h12tiny",
  "h12tiny-client",
  "h12tiny-client-sync",
  "h12tiny-core",
  "h12tiny-server",
  "h12tiny-tls-system",
  "h12tiny-util",
  "h12tiny-web",
  "laputa-h2-futures-lite",
  "laputa-hyper-futures-lite",
  "laputa-fastwebsockets-futures-lite",
]
hyper = ["hyper", "hyper-util", "hyper-rustls", "smol-hyper"]
h2 = ["h2"]
reqwest = ["reqwest"]
ureq = ["ureq"]
surf = ["surf"]
isahc = ["isahc"]
attohttpc = ["attohttpc"]
curl = ["curl"]
awc = ["awc"]
tiny-http = ["tiny_http"]

[http.ban]
hyper = "prefix"
h2 = "prefix"
reqwest = "prefix"
ureq = "prefix"
surf = "prefix"
isahc = "prefix"
attohttpc = "prefix"
curl = "prefix"
awc = "prefix"
tiny-http = "prefix"

[cli-arguments]
ecosystem = "cargo"
preferred = "lexopt"

[cli-arguments.options]
lexopt = ["lexopt"]
clap = ["clap", "clap_complete", "clap_mangen"]
pico-args = ["pico-args"]
argh = ["argh"]
bpaf = ["bpaf"]

[cli-arguments.ban]
clap = "prefix"

[benchmark]
ecosystem = "cargo"
preferred = "rustybench"

[benchmark.options]
rustybench = ["rustybench"]
criterion = ["criterion", "criterion-cycles-per-byte"]
divan = ["divan"]

[benchmark.ban]
criterion = "prefix"

[async-runtime]
ecosystem = "cargo"
preferred = "smolith"

[async-runtime.options]
smolith = [
  "laputa-smol",
  "laputa-smol-macros",
  "laputa-async-broadcast",
  "laputa-async-channel",
  "laputa-async-dup",
  "laputa-async-executor",
  "laputa-async-fs",
  "laputa-async-io",
  "laputa-async-lock",
  "laputa-async-net",
  "laputa-async-process",
  "laputa-async-signal",
  "laputa-async-task",
  "laputa-atomic-waker",
  "laputa-blocking",
  "laputa-concurrent-queue",
  "laputa-easy-parallel",
  "laputa-event-listener",
  "laputa-event-listener-strategy",
  "laputa-futures-lite",
  "laputa-parking",
  "laputa-piper",
  "laputa-polling",
  "laputa-waker-fn",
]
smol = [
  "smol",
  "smol-macros",
  "async-broadcast",
  "async-channel",
  "async-dup",
  "async-executor",
  "async-fs",
  "async-io",
  "async-lock",
  "async-net",
  "async-process",
  "async-signal",
  "async-task",
  "atomic-waker",
  "blocking",
  "concurrent-queue",
  "easy-parallel",
  "event-listener",
  "event-listener-strategy",
  "futures-lite",
  "parking",
  "piper",
  "polling",
  "waker-fn",
]
tokio = ["tokio", "tokio-util"]
async-std = ["async-std"]

[async-runtime.ban]
tokio = "prefix"
smol = "exact"
async-std = "exact"

[serialization]
ecosystem = "cargo"
preferred = "deser"

[serialization.options]
deser = ["deser", "deser-json", "deser-toml", "deser-yaml", "deser-value"]
serde = ["serde", "serde_json", "serde_derive", "serde_core", "serde-saphyr", "serde-pickle"]
miniserde = ["miniserde"]
nanoserde = ["nanoserde"]

[regex]
ecosystem = "cargo"
preferred = "regex-lite"

[regex.options]
regex = ["regex", "regex-automata", "regex-syntax"]
regex-lite = ["regex-lite"]
regex-bites = ["regex-bites"]
fancy-regex = ["fancy-regex"]

[regex.exceptions]
"joshuarli/obsidian-ferrisearch" = "The tokenizer and highlighter split on Unicode general categories (\\p{P}, \\p{Z}, \\p{S}) and search folds non-ASCII case, which regex-lite does not support."
"joshuarli/tansu" = "tansu-search tokenizes and highlights on Unicode general categories (\\p{P}, \\p{Z}, \\p{S}) with case-insensitive matching, which regex-lite does not support."
"laputa-systems/python-build" = "The _re_rs accelerator for CPython's re module needs regex::bytes and regex-syntax's parser, and exists for regex's performance."

[logging]
ecosystem = "cargo"
preferred = "log"

[logging.options]
log = ["log", "env_logger"]
tracing = ["tracing", "tracing-subscriber", "tracing-tree"]

[datetime]
ecosystem = "cargo"
preferred = "jiff"

[datetime.options]
jiff = ["jiff"]
chrono = ["chrono"]
time = ["time"]

[fast-hash]
