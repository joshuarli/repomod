#[overrides."laputa-systems/ntpd-rs"]
#ignore = ["rust-toolchain"]
#ignore_reason = "Fork pinned to the stable channel through a symlinked rust-toolchain.toml that its release job and Dockerfile read."

[overrides."laputa-systems/bbtree"]
ignore = ["rust-toolchain"]
ignore_reason = "Fork whose CI and flake pin the nightly the Verus build needs."

[overrides."laputa-systems/python-build"]
ignore = ["mdtool:D001", "mdtool:P002", "mdtool:R001", "mdtool:R005"]
ignore_reason = "Vendored rustls, webpki, and CPython sources carry \"section N\" text and paths into the CPython tree, the .agents and .claude skill trees repeat skill text on purpose, and the benchmark README names files its commands generate."

[overrides."laputa-systems/ptytest"]
ignore = ["mdtool:R003"]
ignore_reason = "docs/baselines.md quotes the baseline command of another repository."

[overrides."laputa-systems/deser"]
ignore = ["audit-banned:transitive:tokio-macros", "audit-banned:direct:tokio", "audit-banned:direct:tokio-util"]
ignore_reason = "deser-tokio exists to provide Tokio AsyncRead and AsyncWrite integration, so Tokio and its codec adapter are the crate's purpose; tokio-macros arrives through Tokio's test-only macros feature. The fork does not publish crates."

[overrides."laputa-systems/rawzip"]
ignore = ["audit-banned:direct:tokio", "audit-banned:direct:tokio-util"]
ignore_reason = "The unpublished compare crate drives async_zip and rc-zip with a Tokio runtime and TokioAsyncReadCompatExt adapters."

[overrides."joshuarli/obsidian-ferrisearch"]
ignore = ["audit-upgrades:crates:getrandom", "audit-banned:transitive:tokio"]
ignore_reason = "tantivy needs getrandom 0.3; moving the direct dependency breaks the wasm build. Tokio is only reachable through wasm-bindgen's opt-in wasm_bindgen_unstable_tokio cfg for wasm32-unknown-emscripten; wasm32-unknown-unknown builds never compile it."

[overrides."joshuarli/defuddle-rs"]
ignore = ["audit-banned:transitive:tokio"]
ignore_reason = "Tokio is only reachable through wasm-bindgen's opt-in wasm_bindgen_unstable_tokio cfg for wasm32-unknown-emscripten; wasm32-unknown-unknown builds never compile it."

[overrides."joshuarli/toolbox"]
ignore = ["registry-sources:git:shadowdriver", "registry-sources:path:shadowdriver"]
ignore_reason = "shadowdriver stays private and is never published to stuff, so toolbox keeps its git or sibling-path dependency on it."

[overrides."joshuarli/stuff"]
ignore = ["registry-sources"]
ignore_reason = "The registry service must remain buildable when its own package registries are unavailable."

[overrides."joshuarli/tansu"]
ignore = ["registry-sources:git:laputa-h2-futures-lite", "registry-sources:git:laputa-hyper-futures-lite"]
ignore_reason = "tansu depends on two patched git forks (h2-futures-lite, hyper-futures-lite) that are not published to the native stuff registry yet."
