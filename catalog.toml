#[overrides."laputa-systems/ntpd-rs"]
#ignore = ["rust-toolchain"]
#ignore_reason = "Fork pinned to the stable channel through a symlinked rust-toolchain.toml that its release job and Dockerfile read."

[overrides."laputa-systems/bbtree"]
ignore = ["rust-toolchain"]
ignore_reason = "Fork whose CI and flake pin the nightly the Verus build needs."

[overrides."laputa-systems/rawzip"]
ignore = ["rust-project:lockfile:compare"]
ignore_reason = "compare/ is a development tool for comparing against other zip crates, and the repository ignores Cargo.lock on purpose."

[overrides."laputa-systems/h12tiny"]
ignore = ["rust-project:lockfile:crates/laputa-h2-futures-lite"]
ignore_reason = "The vendored h2 fork keeps upstream's own workspace, whose only executables are its fuzz, fixture, and Huffman-table development utilities."

[overrides."laputa-systems/python-build"]
ignore = ["mdtool:D001", "mdtool:P002", "mdtool:R001", "mdtool:R005"]
ignore_reason = "Vendored rustls, webpki, and CPython sources carry \"section N\" text and paths into the CPython tree, the .agents and .claude skill trees repeat skill text on purpose, and the benchmark README names files its commands generate."

[overrides."laputa-systems/ptytest"]
ignore = ["mdtool:R003", "audit-banned:transitive:polling", "audit-banned:transitive:piper", "audit-banned:transitive:concurrent-queue", "audit-banned:transitive:atomic-waker"]
ignore_reason = "docs/baselines.md quotes the baseline command of another repository. polling, piper, concurrent-queue, and atomic-waker arrive only through the alacritty_terminal dev dependency, the reference terminal for the differential test in src/terminal.rs, which has no smolith fork."

[overrides."joshuarli/obsidian-ferrisearch"]
ignore = ["audit-upgrades:crates:getrandom", "audit-banned:transitive:tokio"]
ignore_reason = "tantivy needs getrandom 0.3; moving the direct dependency breaks the wasm build. Tokio is only reachable through wasm-bindgen's opt-in wasm_bindgen_unstable_tokio cfg for wasm32-unknown-emscripten; wasm32-unknown-unknown builds never compile it."

[overrides."laputa-systems/smolith"]
ignore = ["audit-banned:transitive:tokio"]
ignore_reason = "Tokio is only reachable through wasm-bindgen-futures (via the wasm-bindgen-test dev dependency) under its opt-in wasm_bindgen_unstable_tokio cfg for wasm32-unknown-emscripten; the wasm32-unknown-unknown test builds never compile it."

[overrides."joshuarli/kache"]
ignore = ["audit-banned:transitive:tokio"]
ignore_reason = "kunobi-daemon declares tokio as an optional dependency behind its async feature, which kache never enables; Cargo.lock records it, but cargo tree finds no tokio in any target or edge kind."

[overrides."joshuarli/defuddle-rs"]
ignore = ["audit-banned:transitive:tokio"]
ignore_reason = "Tokio is only reachable through wasm-bindgen's opt-in wasm_bindgen_unstable_tokio cfg for wasm32-unknown-emscripten; wasm32-unknown-unknown builds never compile it."

[overrides."joshuarli/toolbox"]
ignore = ["registry-sources:path:shadowdriver"]
ignore_reason = "shadowdriver stays private and is never published to stuff, so toolbox keeps its sibling-path dependency on it."

[overrides."joshuarli/stuff"]
ignore = ["registry-sources"]
ignore_reason = "The registry service must remain buildable when its own package registries are unavailable."
